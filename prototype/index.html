<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونه اولیه تعاملی سرویسا — پلتفرم خدمات آنلاین</title>
<style>
  :root{
    --brand:#0f7a6c; --brand-d:#0b5d52; --brand-l:#e6f4f2;
    --ink:#131720; --ink2:#39414f; --muted:#6b7480; --line:#e3e7ec; --bg:#eef1f4; --card:#fff;
    --amber:#b45309; --amberl:#fff7ed; --blue:#1d4ed8; --bluel:#eef2ff; --rose:#be123c; --rosel:#fff1f3;
    --green:#15803d; --greenl:#f0fdf4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Vazirmatn","IRANSans",Tahoma,system-ui,sans-serif;direction:rtl}
  a{color:var(--brand-d)}
  /* ---------- chrome ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:#0b3f4d;color:#fff;display:flex;flex-wrap:wrap;gap:10px;
    align-items:center;justify-content:space-between;padding:9px 16px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#17b3a0,#0f7a6c);
    display:grid;place-items:center;font-size:15px}
  .roles{display:flex;gap:6px;flex-wrap:wrap}
  .roles button{background:rgba(255,255,255,.12);color:#eaf6f4;border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
  .roles button.on{background:#fff;color:#0b3f4d;font-weight:700}
  .hint{font-size:12px;color:#a9c6c2}
  .stage{display:flex;gap:20px;justify-content:center;align-items:flex-start;padding:18px 16px 60px;max-width:1220px;margin:0 auto}
  /* ---------- phone ---------- */
  .phone{width:392px;flex:0 0 392px;background:#0d1117;border-radius:34px;padding:10px;box-shadow:0 24px 60px rgba(12,23,40,.28)}
  .frame{background:#f7f8fa;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;height:778px}
  .statusbar{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;padding:8px 15px;font-size:11.5px;color:var(--muted)}
  .screen{flex:1;overflow-y:auto;padding:13px 13px 18px}
  .tabbar{display:flex;border-top:1px solid var(--line);background:#fff}
  .tabbar button{flex:1;border:0;background:none;padding:9px 2px 10px;font:inherit;font-size:10.5px;color:var(--muted);
    cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
  .tabbar button i{font-size:16px;font-style:normal}
  .tabbar button.on{color:var(--brand-d);font-weight:700}
  /* ---------- notes panel ---------- */
  .notes{flex:1 1 340px;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    box-shadow:0 6px 22px rgba(16,24,40,.06);position:sticky;top:70px}
  .notes h3{margin:0 0 6px;font-size:16px;color:#0b3f4d}
  .notes .step{font-size:12px;color:var(--muted);margin-bottom:8px}
  .notes p{font-size:13.5px;line-height:1.95;color:var(--ink2);margin:6px 0}
  .notes ul{padding-inline-start:18px;margin:8px 0;font-size:13px;color:var(--ink2)}
  .notes li{margin:3px 0}
  .tag{display:inline-block;background:var(--brand-l);color:var(--brand-d);border:1px solid #c7e6e2;
    border-radius:999px;padding:1px 9px;font-size:11px;margin:2px 2px 0 0}
  .navrow{display:flex;gap:8px;margin-top:14px}
  .navrow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font:inherit;
    font-size:13px;cursor:pointer}
  .navrow button.p{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
  /* ---------- app UI atoms ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .card h4{margin:0 0 6px;font-size:14px}
  .card p{margin:4px 0;font-size:12.5px;color:var(--ink2);line-height:1.85}
  .row{display:flex;align-items:center;gap:9px}
  .row.between{justify-content:space-between}
  .muted{color:var(--muted);font-size:11.5px}
  .hero{background:linear-gradient(135deg,#0f7a6c,#0b3f4d);color:#fff;border-radius:16px;padding:15px;margin-bottom:11px}
  .hero h3{margin:0 0 4px;font-size:16.5px}
  .hero p{margin:0;font-size:12.5px;color:#cfe9e5;line-height:1.8}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font:inherit;font-size:14px;font-weight:700;
    background:var(--brand);color:#fff;cursor:pointer;margin-top:8px}
  .btn.ghost{background:#fff;color:var(--brand-d);border:1px solid #cfe0de}
  .btn.soft{background:var(--brand-l);color:var(--brand-d);border:1px solid #c7e6e2}
  .btn.warn{background:var(--amber);}
  .btn.rose{background:var(--rose)}
  .btn.sm{padding:8px;font-size:12.5px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center;font-size:12px;
    cursor:pointer;line-height:1.7}
  .tile i{display:block;font-size:20px;font-style:normal;margin-bottom:3px}
  .tile.sos{background:var(--rosel);border-color:#ffd0d8;color:#9f1239;font-weight:700}
  .chip{display:inline-block;background:#f1f4f7;border:1px solid var(--line);border-radius:999px;padding:4px 11px;
    font-size:12px;margin:3px 3px 0 0;cursor:pointer}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.warnc{background:var(--amberl);border-color:#fcd9a8;color:#92400e}
  .pill{font-size:10.5px;border-radius:999px;padding:1px 8px;font-weight:700}
  .pill.new{background:var(--brand-l);color:var(--brand-d)}
  .pill.ach{background:#f1f3f5;color:#4b5563}
  .pill.v1{background:var(--amberl);color:var(--amber)}
  .pill.v2{background:#f5f3ff;color:#6d28d9}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #eceff3}
  .kv:last-child{border:0}
  .kv b{font-weight:700}
  .total{font-size:15px;font-weight:800;color:var(--brand-d)}
  .bar{height:7px;border-radius:99px;background:#eef1f4;overflow:hidden;margin:5px 0}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
  .bar.amber i{background:#d97706}
  .field{border:1px solid var(--line);border-radius:11px;padding:9px 10px;font-size:12.5px;color:var(--ink2);background:#fff}
  textarea.field{width:100%;min-height:66px;font:inherit;font-size:12.5px;resize:vertical}
  .empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 8px;line-height:2}
  .stars{display:flex;gap:4px;font-size:19px;color:#d6dbe1;cursor:pointer}
  .stars span.on{color:#f0a500}
  .divider{height:1px;background:var(--line);margin:10px 0}
  .timeline{position:relative;padding-inline-start:16px}
  .timeline:before{content:"";position:absolute;inset-inline-start:4px;top:4px;bottom:4px;width:2px;background:#e6eaf0}
  .tl{position:relative;margin-bottom:9px;font-size:12.5px}
  .tl:before{content:"";position:absolute;inset-inline-start:-16px;top:5px;width:9px;height:9px;border-radius:50%;
    background:#cbd5e1;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
  .tl.done:before{background:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .tl.now:before{background:#f59e0b;box-shadow:0 0 0 1px #f59e0b}
  .tl b{display:block;font-weight:700}
  .tl span{color:var(--muted);font-size:11px}
  .sim{background:#0f1b2a;border-radius:13px;padding:12px;color:#cfe6ff;font-size:12px;line-height:1.9}
  .sim b{color:#7de3d2}
  .wave{display:flex;align-items:flex-end;gap:3px;height:44px;margin:8px 0}
  .wave i{flex:1;background:linear-gradient(180deg,#17b3a0,#0f7a6c);border-radius:3px;animation:w 1.05s ease-in-out infinite}
  .wave i:nth-child(odd){animation-duration:.85s}
  .wave i:nth-child(3n){animation-duration:1.25s}
  @keyframes w{0%,100%{height:16%}50%{height:92%}}
  .photo{height:74px;border-radius:11px;border:1.5px dashed #c9d2dc;display:grid;place-items:center;color:var(--muted);
    font-size:11px;background:repeating-linear-gradient(45deg,#fbfcfd,#fbfcfd 7px,#f4f7fa 7px,#f4f7fa 14px)}
  .radar{position:relative;height:186px;border-radius:14px;background:
     radial-gradient(circle at 50% 55%,#dff1ee 0 22%,#eef7f5 22% 46%,#f7fbfa 46% 100%);
     border:1px solid var(--line);overflow:hidden}
  .radar .ripple{position:absolute;inset-inline-start:50%;top:55%;width:22px;height:22px;margin:-11px;
    border-radius:50%;background:#0f7a6c;opacity:.9}
  .radar .ring{position:absolute;inset-inline-start:50%;top:55%;width:22px;height:22px;margin:-11px;border-radius:50%;
    border:2px solid rgba(15,122,108,.55);animation:ring 2.6s ease-out infinite}
  .radar .ring:nth-child(2){animation-delay:.8s}.radar .ring:nth-child(3){animation-delay:1.6s}
  @keyframes ring{from{transform:scale(1);opacity:.85}to{transform:scale(7.5);opacity:0}}
  .pin{position:absolute;width:11px;height:11px;border-radius:50%;background:#1d4ed8;border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.25)}
  svg.map{display:block;width:100%;height:172px;border-radius:13px;background:#f4f7fa;border:1px solid var(--line)}
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .heat i{height:20px;border-radius:4px;display:block}
  .avatar{width:38px;height:38px;border-radius:50%;background:#dbe7e5;display:grid;place-items:center;font-size:15px;
    color:#0b5d52;flex:0 0 38px}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px}
  .alert{border-inline-start:4px solid var(--rose);background:var(--rosel);border-radius:11px;padding:9px 11px;
    font-size:12px;margin-bottom:8px}
  .okbox{border-inline-start:4px solid var(--green);background:var(--greenl);border-radius:11px;padding:9px 11px;font-size:12px}
  .progress{display:flex;gap:4px;margin:9px 0}
  .progress i{flex:1;height:4px;border-radius:99px;background:#e6eaf0}
  .progress i.on{background:var(--brand)}
  .pad{-webkit-tap-highlight-color:transparent}
  .sticky-cta{position:sticky;bottom:-18px;background:linear-gradient(180deg,rgba(247,248,250,0),#f7f8fa 46%);padding-top:10px}
  @media (max-width:900px){
    .stage{flex-direction:column;align-items:center}
    .phone{flex:1 1 auto;width:100%;max-width:420px}
    .notes{position:static;max-width:none;width:100%;flex:1 1 auto}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo">✦</span><span>سرویسا — نمونه اولیه تعاملی</span></div>
  <div class="roles" id="roles"></div>
  <div class="hint">۲۲ صفحه • کلیک‌پذیر • بدون نیاز به اینترنت</div>
</div>

<div class="stage">
  <div class="phone">
    <div class="frame">
      <div class="statusbar">
        <span id="sbTitle">سرویسا</span>
        <span>۹:۴۱ &nbsp;•&nbsp; ۵G &nbsp;•&nbsp; ۷۸٪</span>
      </div>
      <div class="screen" id="screen"></div>
      <nav class="tabbar" id="tabbar"></nav>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* =========================================================================
   نمونه اولیه تعاملی «سرویسا» — پوشش ماژول‌های ۱ تا ۷ سند
   ساختار: screens[] با متد render؛ state سراسری؛ رندر با innerHTML
   ========================================================================= */
const S = {
  role: 'customer',
  screen: 'c_home',
  urgency: 'same_day',
  photoCount: 0,
  rating: {punctuality:0, quality:0, tidiness:0, price:0, conduct:0},
  selectedProvider: 'علی رضایی',
  online: true,
  timer: null,
  ticket: 0,
  checklist: {before:false, after:false, parts:false},
  milestone: 1
};

const ROLES = [
  {id:'customer', label:'اپ مشتری', first:'c_home'},
  {id:'provider', label:'اپ متخصص', first:'p_home'},
  {id:'support',  label:'پنل پشتیبانی', first:'s_board'}
];

const TABS = {
  customer: [
    {id:'c_home', icon:'⌂', label:'خانه'},
    {id:'c_intake', icon:'＋', label:'سفارش'},
    {id:'c_tracking', icon:'⚲', label:'پیگیری'},
    {id:'c_wallet', icon:'◍', label:'کیف پول'},
    {id:'c_profile', icon:'☺', label:'پروفایل'}
  ],
  provider: [
    {id:'p_home', icon:'⌂', label:'کارها'},
    {id:'p_offer', icon:'◈', label:'پیشنهاد'},
    {id:'p_job', icon:'⚒', label:'اجرا'},
    {id:'p_earn', icon:'◍', label:'درآمد'},
    {id:'p_kyc', icon:'✓', label:'احراز'}
  ],
  support: [
    {id:'s_board', icon:'▤', label:'میز پشتیبانی'},
    {id:'s_ticket', icon:'✉', label:'پرونده'},
    {id:'s_crisis', icon:'⚠', label:'اتاق بحران'},
    {id:'s_risk', icon:'◬', label:'ریسک'}
  ]
};

const money = n => n.toLocaleString('fa-IR') + ' تومان';

/* ------------------------------ SCREENS ------------------------------ */
const screens = {

/* ===================== مشتری ===================== */
c_home: {role:'customer', title:'خانه — انتخاب خدمت', note:{
  h:'صفحه خانه مشتری',
  p:'ورودی اصلی: دسته‌بندی خدمات + دکمه اعزام فوری + کارت سفارش فعال. برای کاربر مهمان (بدون ثبت‌نام) هم قابل مشاهده است تا افت قیف کم شود.',
  refs:['۲.۳ حالت مهمان','۳.۳ اعزام فوری','۱۰ فهرست وایرفریم: C-02'],
  ul:['جست‌وجوی متنی و صوتی','پیشنهاد خدمت بر پایه محل و سابقه','بنر بیمه و گارانتی برای ایجاد اعتماد','ورود به سفارش جاری با یک کلیک']
}, render(){ return `
  <div class="row between" style="margin-bottom:9px">
    <div class="row"><div class="avatar">☺</div><div><b style="font-size:13.5px">سلام، سارا 👋</b><br><span class="muted">تهران، سعادت‌آباد</span></div></div>
    <span class="pill new">مهمان قابل استفاده</span>
  </div>
  <div class="field" onclick="go('c_intake')">🔍 چه کاری لازم داری؟ (لمس کن یا بگو)</div>
  <div class="grid2" style="margin-top:9px">
    <div class="tile sos" onclick="go('c_emergency')">🚨<br>اعزام فوری<br><span style="font-weight:400;font-size:10.5px">همین حالا، ۲۰ ثانیه</span></div>
    <div class="tile" onclick="go('c_intake')">🛠️<br>سفارش عادی<br><span class="muted" style="font-size:10.5px">انتخاب زمان</span></div>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="row between"><b style="font-size:13px">سفارش فعال</b><span class="pill v1">در راه</span></div>
    <p>علی رضایی • تعمیر نشت لوله سینک • رسیدن حدود ۱۴ دقیقه</p>
    <div class="bar"><i style="width:62%"></i></div>
    <button class="btn sm" onclick="go('c_tracking')">پیگیری زنده</button>
  </div>
  <b style="font-size:13px">خدمات پرکاربرد</b>
  <div class="grid3" style="margin-top:7px">
    <div class="tile" onclick="go('c_intake')">🚿<br>لوله‌کشی</div>
    <div class="tile" onclick="go('c_intake')">⚡<br>برقکاری</div>
    <div class="tile" onclick="go('c_intake')">❄️<br>کولر و اسپلیت</div>
    <div class="tile" onclick="go('c_intake')">🔑<br>کلیدسازی</div>
    <div class="tile" onclick="go('c_intake')">🎨<br>نقاشی</div>
    <div class="tile" onclick="go('c_intake')">🧹<br>نظافت</div>
  </div>
  <div class="okbox" style="margin-top:11px">🛡️ هر سفارش به‌صورت خودکار <b>بیمه حوادث و خسارت</b> + <b>گارانتی دسته‌ای</b> دارد.</div>
  <div class="card"><b style="font-size:13px">تخفیف‌های تو</b><p>کوپن «سرویس اول» ۱۵٪ • اشتراک طلایی: معاف از افزایش قیمت پیک</p></div>
`;}},

c_intake: {role:'customer', title:'ثبت سفارش چندرسانه‌ای', note:{
  h:'ورودی چندرسانه‌ای (۳.۱)',
  p:'مشتری لازم نیست دسته‌بندی درست را بداند: توضیح می‌دهد، عکس می‌گیرد یا ویدیو می‌فرستد؛ سیستم دسته و شدت را استنتاج می‌کند.',
  refs:['۳.۱ ورودی چندرسانه‌ای','API: /v1/intake/analyze'],
  ul:['ضبط صوت با راهنمای پرسش','عکس با راهنمای زاویه','تشخیص کلمات خطر (گاز/آب‌گرفتگی)','پیش‌بینی مسیر تریاژ پس از آنالیز']
}, render(){ return `
  <div class="hero"><h3>مشکل رو بگو — ما تشخیص می‌دهیم</h3><p>صوت، عکس یا ویدیو بفرست؛ سیستم نوع کار، شدت و بازه قیمت را پیشنهاد می‌دهد.</p></div>
  <div class="card">
    <div class="row between"><b style="font-size:13px">🎙️ توضیح صوتی</b><span class="muted">۰:۲۱ / حداکثر ۱:۰۰</span></div>
    <div class="wave">${Array.from({length:26},()=>'<i style="height:'+(20+Math.random()*70)+'%"></i>').join('')}</div>
    <div class="field">«آب از زیر سینک آشپزخانه می‌آید و کابینت خیس شده» <span class="muted">— متن خودکار (ASR فارسی)</span></div>
  </div>
  <div class="card">
    <b style="font-size:13px">📷 عکس و ویدیو (اختیاری، نتیجه دقیق‌تر)</b>
    <div class="grid2" style="margin-top:7px">
      ${S.photoCount>0?'<div class="photo">✅ عکس ۱ ثبت شد<br><span class="muted">نشت زیر سینک</span></div>':'<div class="photo" onclick="addPhoto()">＋ نمای کلی</div>'}
      ${S.photoCount>1?'<div class="photo">✅ عکس ۲ ثبت شد<br><span class="muted">کابینت آسیب‌دیده</span></div>':'<div class="photo" onclick="addPhoto()">＋ نمای نزدیک</div>'}
    </div>
    <p class="muted">راهنما: نمای کلی، نمای نزدیک، پلاک/برند دستگاه. موقعیت مکانی از عکس حذف می‌شود.</p>
  </div>
  <div class="card">
    <b style="font-size:13px">علائم خطر</b>
    <p class="muted">انتخاب کن تا مسیر ایمنی فعال شود:</p>
    <span class="chip warnc" onclick="pick(this)">بوی گاز</span>
    <span class="chip warnc" onclick="pick(this)">جرقه/دود برق</span>
    <span class="chip" onclick="pick(this)">آب‌گرفتگی شدید</span>
    <span class="chip" onclick="pick(this)">هیچ‌کدام</span>
  </div>
  <div class="sticky-cta"><button class="btn" onclick="go('c_analyze')">تحلیل هوشمند و ادامه ←</button></div>
`;}},

c_analyze: {role:'customer', title:'تشخیص هوشمند مشکل', note:{
  h:'خروجی تحلیل (۳.۱)',
  p:'مدل، دسته و درجه شدت را پیشنهاد می‌دهد و اگر اطمینان پایین باشد، سفارش را به کارشناس انسانی می‌سپارد. هیچ تصمیم قطعی بدون امکان اصلاح کاربر گرفته نمی‌شود.',
  refs:['AI Intake','آستانه اطمینان ۰.۷۵','مهارت و تجهیزات لازم'],

    <b>گزینه‌های اپراتور:</b> تایید | تعدیل | رد با دلیل | ارجاع به انطباق
  </div>
  <div class="grid2">
    <button class="btn soft sm" onclick="alert('هشدار رسمی صادر شد. کاربر می‌تواند از طریق پنل اعتراض، اعتراض ثبت کند.')">تایید اقدام پیشنهادی</button>
    <button class="btn ghost sm" onclick="alert('ارجاع به سطح ۲ انطباق با بسته شواهد کامل.')">ارجاع به انطباق</button>
  </div>
  <div class="card">
    <b style="font-size:13px">الگوهای فعال این هفته</b>
    <div class="kv"><span>تبانی مشتری–متخصص</span><b>۴ پرونده</b></div>
    <div class="kv"><span>نظر جعلی / حلقه نظرات</span><b>۷ پرونده</b></div>
    <div class="kv"><span>GPS جعلی (Mock Location)</span><b>۲ پرونده</b></div>
    <div class="kv"><span>ادعای خسارت پرتکرار</span><b>۳ پرونده</b></div>
  </div>
`;}}
};

/* ------------------------------ RENDER ------------------------------ */
function go(id){ if(S.timer){clearInterval(S.timer);S.timer=null;} S.screen=id; if(screens[id].role!==S.role){S.role=screens[id].role;} render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setRole(r){ const tab=TABS[r][0].id; if(S.timer){clearInterval(S.timer);S.timer=null;} S.role=r; S.screen=tab; render(); }
function toggleOnline(){ S.online=!S.online; render(); }
function addPhoto(){ S.photoCount=(S.photoCount+1)%3; render(); }
function setUrg(u){ S.urgency=u; render(); }
function pick(el, exclusive){ if(exclusive){ [...el.parentElement.children].forEach(c=>c.classList.remove('on')); } el.classList.toggle('on'); }
function rate(dim,val){ S.rating[dim]=val; drawStars(dim); }
function drawStars(dim){
  const box=document.getElementById('st_'+dim); if(!box) return;
  box.innerHTML=[1,2,3,4,5].map(i=>`<span class="${i<=S.rating[dim]?'on':''}" onclick="rate('${dim}',${i})">★</span>`).join('');
}

function render(){
  const sc = screens[S.screen] || screens[TABS[S.role][0].id];
  const note = sc.note || {};
  document.getElementById('sbTitle').textContent = sc.title;
  document.getElementById('screen').innerHTML = sc.render();
  document.getElementById('screen').scrollTop = 0;
  // role tabs
  document.getElementById('roles').innerHTML = ROLES.map(r=>
    `<button class="${r.id===S.role?'on':''}" onclick="setRole('${r.id}')">${r.label}</button>`).join('');
  // bottom tabs
  const list = TABS[S.role];
  const idx = list.findIndex(t=>t.id===S.screen);
  const tabId = idx>=0 ? list[idx].id : '';
  document.getElementById('tabbar').innerHTML = list.map(t=>
    `<button class="${t.id===tabId?'on':''}" onclick="go('${t.id}')"><i>${t.icon}</i>${t.label}</button>`).join('');
  // notes
  document.getElementById('notes').innerHTML = `
    <h3>${note.h||sc.title}</h3>
    <div class="step">صفحه ${note.step||''} — نقش: ${S.role==='customer'?'مشتری':S.role==='provider'?'متخصص':'پشتیبانی/عملیات'}</div>
    <p>${note.p||''}</p>
    ${note.ul?`<ul>${note.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${note.refs?`<div>${note.refs.map(r=>`<span class="tag">${r}</span>`).join('')}</div>`:''}
    <div class="navrow">
      <button onclick="prevScreen()">← قبلی</button>
      <button class="p" onclick="nextScreen()">بعدی →</button>
    </div>
    <p class="muted" style="margin-top:10px">این نمونه اولیه، منطق بخش‌های سند را شبیه‌سازی می‌کند و به بک‌اند متصل نیست. برای دیدن مسیرها از تب‌های پایین و نقش‌ها از نوار بالا استفاده کنید.</p>
  `;
  if(sc.afterRender) sc.afterRender();
}
function flatScreens(){ return Object.keys(screens); }
function nextScreen(){ const a=flatScreens(); const i=(a.indexOf(S.screen)+1)%a.length; go(a[i]); }
function prevScreen(){ const a=flatScreens(); const i=(a.indexOf(S.screen)-1+a.length)%a.length; go(a[i]); }

render();
</script>
</body>
</html>
